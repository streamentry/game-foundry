name: Verify Foundry
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate research backlog
        run: python3 tools/validate_ideas.py docs/ideas/candidates.csv
      - name: Apple Ads API dry-run (no credentials, no network)
        run: python3 tools/fetch_apple_popularity.py --month 2026-10 --dry-run > /dev/null
      - name: Public catalog scanner dry-run (no network)
        run: python3 tools/scan_storefront.py --country US --max-keywords 5 --dry-run > /dev/null
      - name: Genre-first Apple Ads discovery dry-run
        run: python3 tools/fetch_apple_popularity.py --mode genre --month 2026-10 --countries US,GB --dry-run > /dev/null
      - name: Unit tests for research tooling
        run: python3 -m unittest discover -s tools/tests -v

  godot:
    runs-on: ubuntu-24.04
    env:
      GODOT_VERSION: "4.7.2"
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned official Godot editor
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 0755 "/tmp/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version
      - name: Import scene in headless editor
        run: godot --headless --path games/takuzu-lab --editor --import --quit
      - name: Run deterministic game rules tests
        run: godot --headless --path games/takuzu-lab --script res://tests/test_rules.gd
      - name: Validate deterministic generated puzzle uniqueness
        run: godot --headless --path games/takuzu-lab --script res://tests/test_factory.gd
      - name: Validate offline progress and corrupted save handling
        run: godot --headless --path games/takuzu-lab --script res://tests/test_progress.gd
      - name: Smoke test playable scene and player flows
        run: godot --headless --path games/takuzu-lab --script res://tests/test_scene.gd
      - name: Import Good Eye scene in headless editor
        run: godot --headless --path games/good-eye --editor --import --quit
      - name: Verify Good Eye geometric clipping and deterministic shapes
        run: godot --headless --path games/good-eye --script res://tests/test_geometry.gd
      - name: Verify Good Eye local progress and daily first-attempt rules
        run: godot --headless --path games/good-eye --script res://tests/test_state.gd
      - name: Smoke test Good Eye scene and first play
        run: godot --headless --path games/good-eye --script res://tests/test_scene.gd
      - name: Import Quiet Shot independently
        run: godot --headless --path games/quiet-shot --editor --import --quit
      - name: Validate Quiet Shot physical trajectories and authored boards
        run: godot --headless --path games/quiet-shot --script res://tests/test_ray.gd
      - name: Verify Quiet Shot progression and save recovery
        run: godot --headless --path games/quiet-shot --script res://tests/test_progress.gd
      - name: Smoke test Quiet Shot scene, fire, retry and advance
        run: godot --headless --path games/quiet-shot --script res://tests/test_scene.gd
      - name: Import One Path independently
        run: godot --headless --path games/one-path --editor --import --quit
      - name: Validate One Path graph theory and eight original puzzle routes
        run: godot --headless --path games/one-path --script res://tests/test_rules.gd
      - name: Verify One Path save, resume and guarded progression
        run: godot --headless --path games/one-path --script res://tests/test_progress.gd
      - name: Smoke test One Path board, letter controls, undo and advance
        run: godot --headless --path games/one-path --script res://tests/test_scene.gd
      - name: Import Shikaku Garden independent project
        run: godot --headless --path games/shikaku-garden --editor --import --quit
      - name: Verify Shikaku exact-cover uniqueness and rules
        run: godot --headless --path games/shikaku-garden --script res://tests/test_rules.gd
      - name: Verify Shikaku local progress and restoration
        run: godot --headless --path games/shikaku-garden --script res://tests/test_progress.gd
      - name: Smoke test Shikaku Garden playable scene and navigation
        run: godot --headless --path games/shikaku-garden --script res://tests/test_scene.gd
      - name: Import Odd Bloom independent project
        run: godot --headless --path games/odd-bloom --editor --import --quit
      - name: Verify exactly one structural visual difference per round
        run: godot --headless --path games/odd-bloom --script res://tests/test_patterns.gd
      - name: Verify Odd Bloom first-attempt progression and local save
        run: godot --headless --path games/odd-bloom --script res://tests/test_progress.gd
      - name: Smoke test Odd Bloom round selection and replay
        run: godot --headless --path games/odd-bloom --script res://tests/test_scene.gd
      - name: Import Kakuro Compass independently
        run: godot --headless --path games/kakuro-compass --editor --import --quit
      - name: Verify Kakuro intersections and exact puzzle uniqueness
        run: godot --headless --path games/kakuro-compass --script res://tests/test_rules.gd
      - name: Verify Kakuro entries, local save and progression
        run: godot --headless --path games/kakuro-compass --script res://tests/test_progress.gd
      - name: Smoke test Kakuro inspector, keypad, undo and scene
        run: godot --headless --path games/kakuro-compass --script res://tests/test_scene.gd
      - name: Import Quiet Camp independently
        run: godot --headless --path games/quiet-camp --editor --import --quit
      - name: Validate Quiet Camp matching, constraints and unique boards
        run: godot --headless --path games/quiet-camp --script res://tests/test_rules.gd
      - name: Verify Quiet Camp local save and progression
        run: godot --headless --path games/quiet-camp --script res://tests/test_progress.gd
      - name: Smoke test Quiet Camp tapping, undo and win flow
        run: godot --headless --path games/quiet-camp --script res://tests/test_scene.gd

      - name: Import standalone Futoshiki Terrace
        run: godot --headless --path games/futoshiki-terrace --editor --import --quit
      - name: Validate Futoshiki Terrace rules and unique original puzzles
        run: godot --headless --path games/futoshiki-terrace --script res://tests/test_rules.gd
      - name: Verify Futoshiki Terrace save, corruption recovery and progression
        run: godot --headless --path games/futoshiki-terrace --script res://tests/test_progress.gd
      - name: Smoke test Futoshiki Terrace player input, undo and win
        run: godot --headless --path games/futoshiki-terrace --script res://tests/test_scene.gd
      - name: Import standalone Star Atlas
        run: godot --headless --path games/star-atlas --editor --import --quit
      - name: Validate Star Atlas rules and unique original puzzles
        run: godot --headless --path games/star-atlas --script res://tests/test_rules.gd
      - name: Verify Star Atlas save, corruption recovery and progression
        run: godot --headless --path games/star-atlas --script res://tests/test_progress.gd
      - name: Smoke test Star Atlas player input, undo and win
        run: godot --headless --path games/star-atlas --script res://tests/test_scene.gd
      - name: Import standalone Bridge Isles
        run: godot --headless --path games/bridge-isles --editor --import --quit
      - name: Validate Bridge Isles rules and unique original puzzles
        run: godot --headless --path games/bridge-isles --script res://tests/test_rules.gd
      - name: Verify Bridge Isles save, corruption recovery and progression
        run: godot --headless --path games/bridge-isles --script res://tests/test_progress.gd
      - name: Smoke test Bridge Isles player input, undo and win
        run: godot --headless --path games/bridge-isles --script res://tests/test_scene.gd
      - name: Import standalone Loop Lantern
        run: godot --headless --path games/loop-lantern --editor --import --quit
      - name: Validate Loop Lantern rules and unique original puzzles
        run: godot --headless --path games/loop-lantern --script res://tests/test_rules.gd
      - name: Verify Loop Lantern save, corruption recovery and progression
        run: godot --headless --path games/loop-lantern --script res://tests/test_progress.gd
      - name: Smoke test Loop Lantern player input, undo and win
        run: godot --headless --path games/loop-lantern --script res://tests/test_scene.gd
      - name: Import standalone Hitori Grove
        run: godot --headless --path games/hitori-grove --editor --import --quit
      - name: Validate Hitori Grove rules and unique original puzzles
        run: godot --headless --path games/hitori-grove --script res://tests/test_rules.gd
      - name: Verify Hitori Grove save, corruption recovery and progression
        run: godot --headless --path games/hitori-grove --script res://tests/test_progress.gd
      - name: Smoke test Hitori Grove player input, undo and win
        run: godot --headless --path games/hitori-grove --script res://tests/test_scene.gd