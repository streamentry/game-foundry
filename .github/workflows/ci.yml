name: Verify Foundry
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate research backlog
        run: python3 tools/validate_ideas.py docs/ideas/candidates.csv
      - name: Apple Ads API dry-run (no credentials, no network)
        run: python3 tools/fetch_apple_popularity.py --month 2026-10 --dry-run > /dev/null
      - name: Public catalog scanner dry-run (no network)
        run: python3 tools/scan_storefront.py --country US --max-keywords 5 --dry-run > /dev/null
      - name: Genre-first Apple Ads discovery dry-run
        run: python3 tools/fetch_apple_popularity.py --mode genre --month 2026-10 --countries US,GB --dry-run > /dev/null
      - name: Unit tests for research tooling
        run: python3 -m unittest discover -s tools/tests -v

  godot:
    runs-on: ubuntu-24.04
    env:
      GODOT_VERSION: "4.7.2"
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned official Godot editor
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 0755 "/tmp/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version
      - name: Import scene in headless editor
        run: godot --headless --path games/takuzu-lab --editor --import --quit
      - name: Run deterministic game rules tests
        run: godot --headless --path games/takuzu-lab --script res://tests/test_rules.gd
      - name: Validate deterministic generated puzzle uniqueness
        run: godot --headless --path games/takuzu-lab --script res://tests/test_factory.gd
      - name: Validate offline progress and corrupted save handling
        run: godot --headless --path games/takuzu-lab --script res://tests/test_progress.gd
      - name: Smoke test playable scene and player flows
        run: godot --headless --path games/takuzu-lab --script res://tests/test_scene.gd
      - name: Import Good Eye scene in headless editor
        run: godot --headless --path games/good-eye --editor --import --quit
      - name: Verify Good Eye geometric clipping and deterministic shapes
        run: godot --headless --path games/good-eye --script res://tests/test_geometry.gd
      - name: Verify Good Eye local progress and daily first-attempt rules
        run: godot --headless --path games/good-eye --script res://tests/test_state.gd
      - name: Smoke test Good Eye scene and first play
        run: godot --headless --path games/good-eye --script res://tests/test_scene.gd
      - name: Import Quiet Shot independently
        run: godot --headless --path games/quiet-shot --editor --import --quit
      - name: Validate Quiet Shot physical trajectories and authored boards
        run: godot --headless --path games/quiet-shot --script res://tests/test_ray.gd
      - name: Verify Quiet Shot progression and save recovery
        run: godot --headless --path games/quiet-shot --script res://tests/test_progress.gd
      - name: Smoke test Quiet Shot scene, fire, retry and advance
        run: godot --headless --path games/quiet-shot --script res://tests/test_scene.gd
      - name: Import One Path independently
        run: godot --headless --path games/one-path --editor --import --quit
      - name: Validate One Path graph theory and eight original puzzle routes
        run: godot --headless --path games/one-path --script res://tests/test_rules.gd
      - name: Verify One Path save, resume and guarded progression
        run: godot --headless --path games/one-path --script res://tests/test_progress.gd
      - name: Smoke test One Path board, letter controls, undo and advance
        run: godot --headless --path games/one-path --script res://tests/test_scene.gd
