name: Word Square Studio Web Playtest
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'games/word-square-studio/**'
      - '.github/workflows/word-square-studio-preview.yml'
permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GODOT_VERSION: "4.7.2"
    steps:
      - uses: actions/checkout@v7
      - name: Download and verify official editor and web templates
        run: |
          set -euo pipefail
          cd /tmp
          base="https://github.com/godotengine/godot/releases/download/$GODOT_VERSION-stable"
          curl -fsSL --retry 3 --retry-delay 3 -o SHA512-SUMS.txt "$base/SHA512-SUMS.txt"
          for asset in \
            "Godot_v$GODOT_VERSION-stable_linux.x86_64.zip" \
            "Godot_v$GODOT_VERSION-stable_export_templates.tpz"; do
            curl -fsSL --retry 3 --retry-delay 3 -o "$asset" "$base/$asset"
            grep -F " $asset" SHA512-SUMS.txt | sha512sum --check -
          done
          unzip -q "Godot_v$GODOT_VERSION-stable_linux.x86_64.zip"
          sudo install -m 0755 "Godot_v$GODOT_VERSION-stable_linux.x86_64" /usr/local/bin/godot
          template_dir="$HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable"
          mkdir -p "$template_dir"
          unzip -p "Godot_v$GODOT_VERSION-stable_export_templates.tpz" \
            templates/web_nothreads_release.zip > "$template_dir/web_nothreads_release.zip"
          unzip -p "Godot_v$GODOT_VERSION-stable_export_templates.tpz" \
            templates/version.txt > "$template_dir/version.txt"
          test -s "$template_dir/web_nothreads_release.zip"
          godot --version
      - name: Import project and run deterministic tests
        run: |
          set -euo pipefail
          godot --headless --path games/word-square-studio --editor --import --quit
          godot --headless --path games/word-square-studio --script res://tests/test_rules.gd
          godot --headless --path games/word-square-studio --script res://tests/test_progress.gd
          godot --headless --path games/word-square-studio --script res://tests/test_scene.gd
      - name: Export independent single-threaded WebGL2 build
        run: |
          set -euo pipefail
          mkdir -p build/word-square-studio-web
          godot --headless --path games/word-square-studio --export-release "Web Playtest" "$GITHUB_WORKSPACE/build/word-square-studio-web/index.html"
          for file in index.html index.js index.wasm index.pck; do test -s "build/word-square-studio-web/$file"; done
          printf 'Game: Word Square Studio\nEngine: Godot %s\nCommit: %s\nMode: offline-only, no ads or analytics\n' \
            "$GODOT_VERSION" "$GITHUB_SHA" > build/word-square-studio-web/BUILD.txt
          (cd build/word-square-studio-web && sha256sum index.html index.js index.wasm index.pck > SHA256SUMS.txt)
          cp tools/web_playtest.py build/word-square-studio-web/serve.py
          python3 tools/web_playtest.py --directory build/word-square-studio-web --smoke
      - name: Upload downloadable playtest only (no public deployment)
        uses: actions/upload-artifact@v6
        with:
          name: word-square-studio-web-playtest
          path: build/word-square-studio-web/
          if-no-files-found: error
          retention-days: 7
